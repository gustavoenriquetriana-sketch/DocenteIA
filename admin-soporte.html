<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocenteAI - Admin Soporte</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white"><i
                        class="fa-solid fa-shield-halved"></i></div>
                <span class="font-bold text-slate-800 text-lg">Admin Soporte</span>
            </div>
            <a href="/" class="text-sm font-medium text-slate-500 hover:text-slate-800 transition">Volver al Inicio</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8 fade-in">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Tickets de Soporte</h1>
                <p class="text-slate-500 mt-1">Gestiona los reportes recibidos de los profesores.</p>
            </div>
            <div class="bg-white rounded-lg p-1 border border-slate-200 shadow-sm flex">
                <button onclick="setFilter('all')" id="btn-all"
                    class="px-4 py-2 text-sm font-medium rounded-md bg-indigo-50 text-indigo-700 transition">Todos</button>
                <button onclick="setFilter('Pendiente')" id="btn-pending"
                    class="px-4 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50 transition">Pendientes</button>
                <button onclick="setFilter('Resuelto')" id="btn-solved"
                    class="px-4 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50 transition">Resueltos</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs font-bold uppercase text-slate-500">
                        <tr>
                            <th class="p-5 w-24">ID</th>
                            <th class="p-5 w-32">Fecha</th>
                            <th class="p-5 w-1/4 min-w-[200px]">Usuario</th>
                            <th class="p-5 w-1/3 min-w-[250px]">Asunto</th>
                            <th class="p-5 w-24">Estado</th>
                            <th class="p-5 text-right w-40">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tickets-body" class="divide-y divide-slate-100 text-sm text-slate-700">
                        <!-- Rows -->
                    </tbody>
                </table>
            </div>
            <div id="loading" class="p-12 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Cargando tickets...</p>
            </div>
            <div id="empty-state" class="hidden p-12 text-center text-slate-400">
                <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
                <p>No hay tickets en esta categoría.</p>
            </div>
        </div>
    </main>

    <script>
        let allTickets = [];
        let currentFilter = 'all';

        function fetchTickets() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('tickets-body').innerHTML = '';
            document.getElementById('empty-state').classList.add('hidden');

            const token = localStorage.getItem('docenteai_token');
            fetch(`/api/support/tickets`, {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(res => res.json())
                .then(data => {
                    allTickets = data.tickets || [];
                    renderTickets();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerHTML = '<span class="text-red-500">Error cargando datos.</span>';
                });
        }

        function renderTickets() {
            const tbody = document.getElementById('tickets-body');
            tbody.innerHTML = '';
            document.getElementById('loading').classList.add('hidden');

            const filtered = allTickets.filter(t => currentFilter === 'all' || t.estado === currentFilter);

            if (filtered.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-state').classList.add('hidden');
            }

            filtered.forEach(ticket => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition group";

                const date = new Date(ticket.creado_en).toLocaleDateString('es-VE', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                });

                const currentStatus = ticket.estado || 'Abierto';
                const statusBadge = currentStatus === 'Resuelto'
                    ? '<span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase bg-green-100 text-green-700 border border-green-200">Resuelto</span>'
                    : '<span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase bg-yellow-100 text-yellow-700 border border-yellow-200">' + currentStatus + '</span>';

                tr.innerHTML = `
                    <td class="p-5 font-mono text-xs text-slate-500">${ticket.id}</td>
                    <td class="p-5 text-slate-500 text-xs">${date}</td>
                    <td class="p-5">
                        <div class="font-bold text-slate-800">Profe ID:</div>
                        <div class="text-xs text-slate-500">${ticket.profesor_id}</div>
                    </td>
                    <td class="p-5">
                        <div class="font-medium text-slate-800">${ticket.asunto}</div>
                        <div class="text-xs text-slate-500 truncate max-w-xs mt-0.5" title="${ticket.descripcion}">${ticket.descripcion}</div>
                    </td>
                    <td class="p-5 transition-all duration-300">${statusBadge}</td>
                    <td class="p-5 text-right">
                        ${currentStatus !== 'Resuelto' ?
                        `<div class="flex flex-col gap-2 items-end">
                            <button onclick="actualizarEstadoTicket('${ticket.id}', 'Resuelto')" 
                                class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition shadow-sm w-full">
                                Marcar Resuelto
                            </button>
                         </div>` :
                        `<button onclick="actualizarEstadoTicket('${ticket.id}', 'Pendiente')" 
                            class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-100 transition shadow-sm">
                            Reabrir Caso
                        </button>`
                    }
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function setFilter(filter) {
            currentFilter = filter;

            // UI Update
            ['btn-all', 'btn-pending', 'btn-solved'].forEach(id => {
                const btn = document.getElementById(id);
                btn.className = "px-4 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50 transition";
            });

            const activeBtn = document.getElementById('btn-' + (filter === 'all' ? 'all' : (filter === 'Pendiente' ? 'pending' : 'solved')));
            activeBtn.className = "px-4 py-2 text-sm font-medium rounded-md bg-indigo-50 text-indigo-700 transition shadow-sm ring-1 ring-indigo-200";

            renderTickets();
        }

        async function actualizarEstadoTicket(ticketId, nuevoEstado) {
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const token = localStorage.getItem('docenteai_token');
            if (!token) {
                alert("Error de autenticación: No hay token guardado.");
                return;
            }

            try {
               // In a real scenario, this fetches from the backend
            // Let's assume we fetch from our new supbase integration api
            const response = await fetch(`/api/support/ticket/${encodeURIComponent(ticketId)}/status`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ estado: nuevoEstado })
            });

                const data = await response.json();

                if (data.success) {
                    // Refrescar la tabla transparentemente en segundo plano
                    fetchTickets();
                } else {
                    alert('Error: ' + (data.error || 'No se pudo actualizar'));
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Error updating ticket status:", error);
                alert("Error de conexión al actualizar el ticket.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Init
        fetchTickets();
    </script>
</body>

</html>
