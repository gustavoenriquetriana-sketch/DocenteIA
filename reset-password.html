<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña | DocenteAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Nueva Contraseña</h1>
            <p class="text-slate-500 text-sm mt-2">Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.</p>
        </div>

        <form id="reset-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Nueva Contraseña</label>
                <input type="password" id="new-pass" required minlength="6"
                    class="w-full p-4 border border-slate-200 bg-slate-50 rounded-xl focus:outline-none focus:border-blue-600 focus:bg-white transition text-sm font-bold text-slate-800">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Confirmar Contraseña</label>
                <input type="password" id="confirm-pass" required minlength="6"
                    class="w-full p-4 border border-slate-200 bg-slate-50 rounded-xl focus:outline-none focus:border-blue-600 focus:bg-white transition text-sm font-bold text-slate-800">
                <p id="msg-error" class="text-red-500 text-xs mt-2 hidden font-bold"></p>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold text-sm hover:bg-blue-800 transition shadow-lg mt-4">
                Actualizar Contraseña
            </button>
        </form>

        <div id="success-view" class="hidden text-center py-8">
            <div
                class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2">¡Listo!</h3>
            <p class="text-slate-500 text-sm mb-6">Tu contraseña ha sido actualizada correctamente.</p>
            <a href="index.html"
                class="inline-block bg-blue-600 text-white px-6 py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition">
                Ir al Inicio de Sesión
            </a>
        </div>
    </div>

    <script>
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('new-pass').value;
            const confirm = document.getElementById('confirm-pass').value;
            const msgError = document.getElementById('msg-error');
            const btn = document.getElementById('btn-submit');

            // Get token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                msgError.innerText = "Token inválido o faltante.";
                msgError.classList.remove('hidden');
                return;
            }

            if (pass !== confirm) {
                msgError.innerText = "Las contraseñas no coinciden.";
                msgError.classList.remove('hidden');
                return;
            }

            msgError.classList.add('hidden');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Actualizando...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: pass })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('reset-form').classList.add('hidden');
                    document.getElementById('success-view').classList.remove('hidden');
                } else {
                    msgError.innerText = data.error || "Error al actualizar.";
                    msgError.classList.remove('hidden');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                msgError.innerText = "Error de conexión.";
                msgError.classList.remove('hidden');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
